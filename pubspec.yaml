name: vaultly
description: "Vaultly - a 100% offline, encrypted password & passkey manager."
publish_to: "none"
version: 2.0.0+2

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  pointycastle: ^4.0.0
  path: ^1.9.0
  path_provider: ^2.1.6
  local_auth: ^3.0.2
  flutter_secure_storage: ^11.2.0
  file_picker: ^13.3.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
