name: vaultly
description: A secure, syncing password manager.
publish_to: "none"
version: 1.2.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  sqflite: ^2.3.0
  path: ^1.8.3
  encrypt: ^5.0.3
  crypto: ^3.0.3
  supabase_flutter: ^2.3.2
  uuid: ^4.2.1
  intl: ^0.20.2
  share_plus: ^13.1.0
  file_picker: ^12.0.0-beta.5
  path_provider: ^2.1.2
  local_auth: ^3.0.1
  flutter_secure_storage: ^10.3.1
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
