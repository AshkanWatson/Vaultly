name: vaultly
description: A secure, syncing password manager.
publish_to: "none"
version: 1.2.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  sqflite: ^2.3.0
  path: ^1.8.3
  encrypt: ^5.0.3
  crypto: ^3.0.3
  supabase_flutter: ^2.3.2
  uuid: ^4.2.1
  intl: ^0.19.0
  share_plus: ^9.0.0
  file_picker: ^8.0.0
  path_provider: ^2.1.2
  local_auth: ^2.2.0
  flutter_secure_storage: ^9.0.0
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
